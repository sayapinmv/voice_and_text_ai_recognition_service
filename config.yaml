ai_models:
  speech_to_text:
    # Настройки модели Whisper
    model_settings:
      # tiny, tiny.en, base, base.en, small, small.en,
      # medium, medium.en, large, large-v1, large-v2,
      # large-v3, large-v3-turbo, turbo
      name: small

      # cpu или cuda
      device: cpu

      # Удерживать модель в памяти
      in_memory: false

    # Настройки транскрибации
    default_transcription_settings:
      # Язык аудио; null для автоопределения
      language: ru

      # transcribe — распознавание
      # translate — перевод на английский
      task: transcribe

      # Температура: число от 0 до 1 или список значений
      temperature: 0.2

      # Пороги фильтрации результата
      compression_ratio_threshold: 2.4
      logprob_threshold: -1.0
      no_speech_threshold: 0.7

      # Контекст
      condition_on_previous_text: true
      initial_prompt: null

      # Временные метки
      word_timestamps: false
      without_timestamps: false
      hallucination_silence_threshold: null

      # Вывод и вычисления
      verbose: false
      fp16: false

      # Параметры декодирования
      beam_size: 5
      best_of: 5
      patience: null
      length_penalty: null

      # Формат файла результата: txt, srt, vtt, json
      output_format: txt


  text_to_speech:
    model_settings:
      model_path: "./models/qwen-tts"
      device_map: "cpu"                    # cpu | cuda:0 | auto
      dtype: "bfloat16"                # bfloat16 | float16 | float32
      attn_implementation: "sdpa"      # sdpa | flash_attention_2

    # ============================================
    # Qwen TTS — настройки генерации по умолчанию
    # Используются, если в запросе не передан model_settings.
    # Можно переопределять на каждый запрос.
    # ============================================
    default_transcription_settings:
      speaker: "Vivian"
      language: "Russian"
      instruct: null                   # только для моделей 1.7B
      output_format: "wav"

      # Параметры сэмплирования (передаются в generate_custom_voice)
      do_sample: true
      temperature: 0.85
      top_k: 50
      top_p: 0.95
      repetition_penalty: 1.05
      max_new_tokens: 600

server:
  host: localhost
  port: 80

pg_perovskite_dev:
  db_name: ${PG_PEROVSKITE_DEV_DB_NAME}
  user: ${PG_PEROVSKITE_DEV_USER}
  password: ${PG_PEROVSKITE_DEV_PASSWORD}
  host: localhost
  port: 5432

logging:
  std_logger:
    version: 1
    disable_existing_loggers: False

    formatters:
      structured:
        (): src.module.logger.std_logging.formatter.StructuredFormatter
        datefmt: "%Y-%m-%d %H:%M:%S"
      colored:
        (): src.module.logger.std_logging.formatter.ColoredFormatter
        format: '%(asctime)s - %(name)s - [%(levelname)s] - %(message)s'
        datefmt: "%Y-%m-%d %H:%M:%S"
      json:
        format: '{"time": "%(asctime)s", "name": "%(name)s", "level": "%(levelname)s", "message": "%(message)s"}'
        datefmt: "%Y-%m-%d %H:%M:%S"

    handlers:
      file:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: json
        # Path must be valid. Log file will create
        filename: ./logs/app.log
        maxBytes: 5120
        backupCount: 5
        encoding: utf8
      stdout:
        class: logging.StreamHandler
        level: DEBUG
        formatter: colored
        stream: ext://sys.stdout

    loggers:
      root:
        level: DEBUG
        handlers: [file, stdout]
