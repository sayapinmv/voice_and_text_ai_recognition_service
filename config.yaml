ai_models:
  speech_to_text:
    transcriptions_dirpath: ./outputs/speech_to_text
    origins_dirpath: ./inputs/media
    model_settings:
      name: base
      device: 'cpu'
      in_memory: true
      language: 'ru'  # string: "ru", "en", "fr" и т.д. или null для автоопределения
      task: "transcribe"  # string: "transcribe" или "translate"

      # Параметры семплинга
      temperature: 0.0  # float или список

      # Пороговые значения для отбраковки
      compression_ratio_threshold: 2.4  # float или null
      logprob_threshold: -1.0  # float или null
      no_speech_threshold: 0.6  # float или null

      # Дополнительные параметры
      condition_on_previous_text: true  # boolean
      initial_prompt: null  # string или null
      word_timestamps: false  # boolean
      verbose: false  # boolean
      fp16: true  # boolean

#  text_to_speech:
#    model_name:

server:
  host: localhost
  port: 80

pg_perovskite_dev:
  db_name: ${PG_PEROVSKITE_DEV_DB_NAME}
  user: ${PG_PEROVSKITE_DEV_USER}
  password: ${PG_PEROVSKITE_DEV_PASSWORD}
  host: localhost
  port: 5432

logging:
  std_logger:
    version: 1
    disable_existing_loggers: False

    formatters:
      structured:
        (): src.module.logger.std_logging.formatter.StructuredFormatter
        datefmt: "%Y-%m-%d %H:%M:%S"
      colored:
        (): src.module.logger.std_logging.formatter.ColoredFormatter
        format: '%(asctime)s - %(name)s - [%(levelname)s] - %(message)s'
        datefmt: "%Y-%m-%d %H:%M:%S"
      json:
        format: '{"time": "%(asctime)s", "name": "%(name)s", "level": "%(levelname)s", "message": "%(message)s"}'
        datefmt: "%Y-%m-%d %H:%M:%S"

    handlers:
      file:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: json
        # Path must be valid. Log file will create
        filename: ./logs/app.log
        maxBytes: 5120
        backupCount: 5
        encoding: utf8
      stdout:
        class: logging.StreamHandler
        level: DEBUG
        formatter: colored
        stream: ext://sys.stdout

    loggers:
      root:
        level: DEBUG
        handlers: [file, stdout]
